<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5B4BDB">
<title>Ganbaru</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ganbaru">
<meta name="description" content="Un banco donde tu esfuerzo es la moneda y tus gustos son lo que compras.">
<style>body{padding-top:env(safe-area-inset-top)}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+JP:wght@700&display=swap">
<style>
:root{
  --bg:#F7F6FB;--sf:#FFFFFF;--bd:#E4E2EE;--tx:#17162B;--t2:#5E5C72;
  --pr:#5B4BDB;--pr-d:#3A2E9E;--pr-t:#ECEAFB;
  --ac:#F2B53A;--ac-d:#8A5A00;--ac-t:#FDF3DC;
  --su:#1E7F55;--su-t:#E3F3EB;--wa:#9A5C00;--er:#C93636;--er-t:#FBEAEA;--inf:#2F63C9;
  --r:16px;--h:'Space Grotesk',system-ui,sans-serif;--b:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--b);font-size:15px;line-height:1.45}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-family:var(--h);font-variant-numeric:tabular-nums}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding:calc(16px + env(safe-area-inset-top)) 16px calc(104px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.brand{font-family:var(--h);font-weight:700;font-size:19px;letter-spacing:-.01em}
.lvl{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--sf);border:1px solid var(--bd);border-radius:999px;padding:5px 12px 5px 6px}
.lvl b{background:var(--pr);color:#fff;border-radius:999px;font-family:var(--h);font-size:12px;padding:2px 8px;font-weight:600}
.xp{width:56px;height:6px;border-radius:3px;background:var(--pr-t);overflow:hidden}
.xp i{display:block;height:100%;background:var(--pr);border-radius:3px}
h2{font-family:var(--h);font-size:18px;font-weight:600;margin:24px 0 10px;display:flex;align-items:center;justify-content:space-between}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r)}
.bal{padding:18px;position:relative;overflow:hidden}
.bal .lab{font-size:13px;color:var(--t2);display:flex;align-items:center;gap:8px}
.bal .amt{display:flex;align-items:center;gap:10px;margin-top:6px}
.bal .amt .num{font-size:46px;font-weight:700;line-height:1;letter-spacing:-.02em}
.bal.debt{background:var(--er-t);border-color:#EDB8B8}
.bal.debt .amt .num{color:var(--er)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px}
.pill.er{background:var(--er);color:#fff}
.pill.su{background:var(--su-t);color:var(--su)}
.pill.pr{background:var(--pr-t);color:var(--pr-d)}
.dbar{height:8px;border-radius:4px;background:#F2D3D3;margin-top:14px;overflow:hidden}
.dbar i{display:block;height:100%;background:var(--er);border-radius:4px}
.bal .msg{font-size:13px;color:var(--t2);margin-top:8px}
.bal.debt .msg{color:#8E2626}
.bump{animation:bump .45s ease}
@keyframes bump{30%{transform:scale(1.08)}}
.week{display:flex;gap:8px;margin-top:10px}
.week .card{flex:1;padding:10px 12px}
.week .k{font-size:12px;color:var(--t2)}
.week .v{font-size:20px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mis{position:relative;text-align:left;padding:14px;min-height:112px;display:flex;flex-direction:column;gap:8px;border-bottom-width:3px;transition:transform .12s}
.mis:active{transform:translateY(2px);border-bottom-width:1px;margin-top:2px}
.mis .ic{width:40px;height:40px;border-radius:12px;background:var(--pr-t);color:var(--pr);display:flex;align-items:center;justify-content:center}
.mis .nm{font-weight:500;font-size:14px;line-height:1.3}
.mis .ft{margin-top:auto;display:flex;align-items:center;justify-content:space-between}
.gold{display:inline-flex;align-items:center;gap:4px;background:var(--ac);color:var(--tx);font-family:var(--h);font-weight:600;font-size:13px;border-radius:8px;padding:2px 8px}
.today{font-size:12px;color:var(--t2)}
.mis.flash{border-color:var(--ac);background:var(--ac-t)}
.mis .edit{position:absolute;top:10px;right:10px;color:var(--t2)}
.add{border:1.5px dashed #CBC7DD;background:transparent;color:var(--t2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:112px;border-radius:var(--r);font-weight:500}
.lnk{background:none;border:0;color:var(--pr);font-family:var(--b);font-size:14px;font-weight:500;padding:6px 4px;min-height:36px}
.float{position:fixed;pointer-events:none;font-family:var(--h);font-weight:700;font-size:22px;color:var(--ac-d);animation:fl 1s ease-out forwards;z-index:60}
@keyframes fl{to{transform:translateY(-70px);opacity:0}}
.rw{display:flex;align-items:center;gap:12px;padding:12px 14px}
.rw+.rw{border-top:1px solid var(--bd)}
.rw .ic{width:44px;height:44px;border-radius:12px;background:var(--ac-t);color:var(--ac-d);display:flex;align-items:center;justify-content:center;flex:none}
.rw .mid{flex:1;min-width:0}
.rw .nm{font-weight:500}
.rw .sub{font-size:12px;color:var(--t2)}
.btn{border:0;border-radius:12px;padding:0 16px;min-height:44px;font-weight:600;background:var(--pr);color:#fff;border-bottom:3px solid var(--pr-d)}
.btn:active{border-bottom-width:1px;transform:translateY(2px)}
.btn.sec{background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-bottom:3px solid var(--bd)}
.btn.dng{background:var(--er);border-bottom-color:#8E2626}
.btn.wide{width:100%}
.btn.off{background:#E9E7F1;color:#6E6C82;border-bottom-color:#D7D4E3}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--er-t);color:#8E2626;font-size:13px;margin-bottom:12px;border:1px solid #EDB8B8}
.banner.info{background:var(--pr-t);color:var(--pr-d);border-color:#D6D1F6}
.machine{display:flex;align-items:center;gap:14px;padding:16px;margin-bottom:12px}
.machine .t{font-family:var(--h);font-weight:600;font-size:16px}
.machine .s{font-size:13px;color:var(--t2)}
.day{font-size:12px;color:var(--t2);font-weight:600;margin:16px 4px 6px}
.plus{color:var(--su);font-weight:600}
.minus{color:var(--er);font-weight:600}
.icb{background:none;border:0;color:var(--t2);width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:120px;padding:14px 14px 0}
.bars .b{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bars .b i{display:block;width:100%;max-width:26px;border-radius:6px 6px 2px 2px;background:var(--pr);min-height:3px}
.bars .b.now i{background:var(--ac)}
.bars .b span{font-size:11px;color:var(--t2)}
.bars-l{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;padding:6px 14px 12px;font-size:12px;color:var(--t2);text-align:center}
.cmp{display:flex;align-items:center;gap:10px;padding:10px 14px}
.cmp+.cmp{border-top:1px solid var(--bd)}
.cmp .nm{flex:1}
.cmp .n{font-family:var(--h);font-weight:600;min-width:24px;text-align:right}
.cmp .d{font-size:12px;min-width:52px;text-align:right}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:500;color:var(--t2)}
.field input,.field textarea{border:1px solid var(--bd);background:var(--sf);border-radius:12px;padding:10px 12px;min-height:44px;outline:none}
.field input:focus,.field textarea:focus{border-color:var(--pr);box-shadow:0 0 0 3px var(--pr-t)}
.field .err{font-size:13px;color:var(--er)}
.field .hint{font-size:12px;color:var(--t2)}
.icons{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.icons button{aspect-ratio:1;border:1px solid var(--bd);background:var(--sf);border-radius:12px;color:var(--t2);display:flex;align-items:center;justify-content:center}
.icons button.on{border:2px solid var(--pr);color:var(--pr);background:var(--pr-t)}
.set{padding:4px 0}
.set .row{display:flex;align-items:center;gap:12px;padding:12px 14px}
.set .row+.row{border-top:1px solid var(--bd)}
.set .row .mid{flex:1}
.set .row .sub{font-size:12px;color:var(--t2)}
.set input[type=number]{width:84px;border:1px solid var(--bd);border-radius:10px;padding:8px;text-align:right;min-height:40px}
.sync{font-size:12px;color:var(--t2);display:flex;align-items:center;gap:6px;margin-top:10px;justify-content:center}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--su)}
.sync.loc i{background:var(--wa)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);border-top:1px solid var(--bd);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;min-height:52px;color:var(--t2);text-decoration:none;font-size:12px;font-weight:500;border-radius:12px}
nav.tabs a.on{color:var(--pr)}
nav.tabs a.on .ti{background:var(--pr-t)}
nav.tabs a.xt{position:relative;color:var(--su)}nav.tabs a.xt::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:1px;background:var(--bd)}nav.tabs a.xt .ti{background:var(--su-t)}nav.tabs a.xt.on{color:var(--su)}nav.tabs a.xt.on .ti{background:var(--su);color:#fff}
body.fitface{--pr:#2E7D5B;--pr-d:#1D5A41;--pr-t:#E3F1E9;--bg:#F3F8F4;--su:#1C6E8C;--su-t:#E0F0F6;background:var(--bg)}
body.fitface .hero{background:#2E7D5B}
.swch{text-decoration:none;flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--bd);background:var(--sf);border-radius:999px;padding:4px 10px 4px 4px;font-size:13px;font-weight:600;color:var(--tx);min-height:36px}
.swch .sl{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.fitgold{margin-left:auto;display:flex;align-items:center;gap:6px;background:var(--sf);border:1px solid var(--bd);border-radius:999px;padding:5px 12px 5px 6px;font-weight:600;font-size:13px}
#app.swap{animation:swapin .32s ease-out}
@keyframes swapin{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.hero+section.card,.hero+.card{margin-top:16px}

.pos{display:flex;flex-direction:column;align-items:center;gap:0;padding:28px 0 8px;position:relative;cursor:pointer}
.pos-term{width:170px;height:230px;border-radius:26px;background:#1D1B2E;padding:16px 14px;display:flex;flex-direction:column;gap:12px;box-shadow:0 22px 40px -18px rgba(23,22,43,.6);position:relative;z-index:1}
.pos-scr{background:#2B2942;border-radius:12px;height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:6px}
.pos-scr b{font-family:var(--h);font-size:24px}.pos-scr span{font-size:12px;opacity:.8;margin-top:4px}
.pos-scr.ok{background:#1E7F55}.pos-scr.no{background:#C93636}
.pos-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.pos-keys i{height:14px;border-radius:5px;background:#34324D}
.pos-nfc{position:absolute;top:118px;left:50%;transform:translateX(-50%);color:#5B4BDB;opacity:0}
.pos.tap .pos-nfc{animation:nfc .7s ease-out 2}
@keyframes nfc{0%{opacity:0;transform:translateX(-50%) scale(.7)}40%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(1.25)}}
.pos-card{width:176px;margin-top:-40px;z-index:2;transform:translateY(160px) rotate(-8deg);opacity:0;transition:transform .55s cubic-bezier(.2,.9,.25,1.1),opacity .3s}
.pos-card .ccard{padding:10px 12px;border-radius:12px;cursor:default}.pos-card .ccard .cc-num{font-size:11px}.pos-card .ccard .cc-bot,.pos-card .cc-num,.pos-card .cc-tier{display:none}
.pos.in .pos-card{transform:translateY(-52px) rotate(-6deg);opacity:1}
.pos.tap .pos-card{transform:translateY(-70px) rotate(-3deg) scale(.97)}
.pos.done .pos-card{transform:translateY(40px) rotate(-10deg);opacity:0;transition-duration:.45s}
.pos-skip{font-size:12px;color:var(--t2);margin-top:6px}
details.fold>summary{list-style:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary h2{justify-content:flex-start;gap:8px}details.fold>summary h2>span:first-child{flex:1}
details.fold>summary h2 .chev{display:inline-flex;margin-left:2px;color:var(--t2);transition:transform .25s;vertical-align:middle}
details.fold[open]>summary h2 .chev{transform:rotate(180deg)}
details.fold:not([open])>summary h2{margin-bottom:6px}
details.fold>.fold-body{animation:foldin .25s ease-out}
@keyframes foldin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.morebtn{width:100%;margin-top:10px}
.doc{background:#FFFEFA;color:#17162B;border-radius:6px;padding:20px 18px 16px;box-shadow:0 1px 0 #E4E2EE,0 14px 30px -18px rgba(23,22,43,.4);font-size:13px;position:relative}
.doc:after{content:'';position:absolute;left:0;right:0;bottom:-8px;height:8px;background:radial-gradient(circle at 6px 0,#FFFEFA 6px,transparent 6.5px) 0 0/12px 8px repeat-x}
.doc .dl{display:flex;justify-content:space-between;gap:10px;padding:4px 0}.doc .dl span{color:#5E5C72}
.doc .dsep{border-top:1px dashed #C9C6D9;margin:10px 0}
.doc .dtot{display:flex;justify-content:space-between;align-items:baseline;background:#ECEAFB;border-radius:8px;padding:10px 12px;margin-top:8px}
.doc .dtot b{font-family:var(--h);font-size:22px;color:#3A2E9E}
.doc .dmv{display:grid;grid-template-columns:52px 1fr auto;gap:8px;padding:5px 0;border-bottom:1px solid #F0EEF6}
.doc .dmv:last-child{border-bottom:0}.doc .dmv em{font-style:normal;color:#5E5C72}
.doc .dh{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#5E5C72;margin:14px 0 6px;font-weight:600}
.oni-b{display:inline-flex;flex:none}.oni.talk .oni-b,.masc.talk{animation:oniHop .45s cubic-bezier(.3,1.6,.5,1)}.oni .say-b,.bubble{transition:opacity .2s}
@keyframes oniHop{0%{transform:none}40%{transform:translateY(-8px) rotate(-6deg)}100%{transform:none}}
.oeye{transform-origin:32px 31.5px;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.1)}}
@media (prefers-reduced-motion:reduce){.oeye{animation:none}}
.sh-card{padding:0;overflow:hidden;display:flex;flex-direction:column}
.sh-top{height:84px;display:flex;align-items:center;justify-content:center;position:relative}
.sh-seal{position:absolute;top:8px;left:8px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:7px}
.sh-fav{position:absolute;top:4px;right:4px;width:36px;height:36px;border:0;background:none;color:rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;border-radius:50%}
.sh-fav.on{color:#D4537E}.sh-fav.on svg{fill:#D4537E}
.sh-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.sh-body .nm{font-weight:600;font-size:14px;line-height:1.3;flex:1}
.sh-sub{font-size:12px;color:var(--t2);min-height:16px}
.sh-buy{margin-top:6px;display:flex;align-items:center;justify-content:center;gap:6px;min-height:42px}
.sh-cats{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px}.sh-cats .pill{flex:none;min-height:34px;border:1px solid var(--bd);background:var(--sf);color:var(--t2)}.sh-cats .pill.pr{border-color:transparent;background:var(--pr);color:#fff}
.sh-offer{width:100%;display:flex;align-items:center;gap:12px;background:#26215C;color:#fff;border:0;border-radius:18px;padding:14px;margin-top:14px;font:inherit;cursor:pointer}
.sh-offer-ic{width:62px;height:62px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none}
.sh-fest{display:flex;gap:12px;align-items:center;color:#fff;border-radius:18px;padding:14px;margin-top:14px}
.sh-fest-ic{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex:none}
.done-chips{display:flex;flex-wrap:wrap;gap:6px}.done-chips button{border:0;background:var(--pr-t);color:var(--pr-d);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;min-height:34px}
.dayring{display:flex;align-items:center;gap:14px;position:relative}
.lg-ic.sunrise svg circle{animation:sunUp .8s cubic-bezier(.3,1.4,.5,1);transform-box:fill-box;transform-origin:center}
.lg-ic.sunrise svg path:last-child{animation:rays .8s ease-out;transform-origin:20px 22px}
@keyframes sunUp{0%{transform:translateY(0)}35%{transform:translateY(-7px) scale(1.12)}100%{transform:none}}
@keyframes rays{0%{opacity:1}30%{opacity:.2}100%{opacity:1}}
.sun-burst{position:fixed;width:0;height:0;pointer-events:none;z-index:60}
.sun-burst i{position:absolute;left:-2px;top:-6px;width:4px;height:12px;border-radius:2px;background:#F3B53F;transform-origin:2px 6px;animation:burst .8s ease-out forwards}
@keyframes burst{0%{opacity:1;transform:rotate(var(--r)) translateY(-14px) scaleY(.4)}70%{opacity:1}100%{opacity:0;transform:rotate(var(--r)) translateY(-34px) scaleY(1)}}
.fh-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:4px}
.fh-tile{padding:12px;position:relative}
.fh-q{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;border:0;background:var(--pr-t);color:var(--pr-d);font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-8px)}}@keyframes scanbar{from{transform:translateX(-10%)}to{transform:translateX(160%)}}
nav.tabs .ti{width:44px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:40;background:var(--tx);color:#fff;border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;font-size:14px;width:calc(100% - 32px);max-width:448px;animation:tin .2s ease}
.toast button{background:none;border:0;color:var(--ac);font-weight:600;padding:8px 10px;min-height:40px}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}
.ov{position:fixed;inset:0;z-index:50;background:rgba(23,22,43,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--sf);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:sup .22s ease}
@keyframes sup{from{transform:translateY(30px);opacity:.4}}
.sheet h3{font-family:var(--h);font-size:20px;margin:0 0 4px;font-weight:600}
.sheet p.d{color:var(--t2);font-size:14px;margin:0 0 16px}
.acts{display:flex;gap:10px;margin-top:8px}
.acts .btn{flex:1}
.ov.center{align-items:center}
.gacha{background:var(--sf);border-radius:24px;padding:28px 22px 22px;width:calc(100% - 40px);max-width:360px;text-align:center}
.cap{width:132px;height:132px;margin:0 auto 18px;position:relative;animation:drop .7s cubic-bezier(.3,1.4,.6,1) both}

function sv(p,s){return '<svg width="'+(s||22)+'" height="'+(s||22)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>'}
function ic(n,s){return sv(I[n]||I.star,s)}
function ui(n,s){return sv(U[n],s)}
function coin(s){s=s||22;return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="'+P.ac+'"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="#B07A00" stroke-width="1.6"/><path d="M12 8.5v7" stroke="#B07A00" stroke-width="1.8" stroke-linecap="round"/></svg>'}
function logo(s,off,tile){

  var star='M32 40 L33.3 43.2 L36.8 43.5 L34.1 45.7 L34.9 49 L32 47.2 L29.1 49 L29.9 45.7 L27.2 43.5 L30.7 43.2 Z';

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function fmt(n){return (n<0?'−':'')+Math.abs(Math.round(n)).toLocaleString('es-CL')}

/* ---------- estado ---------- */
var KEY='canje-personal-v1';
function seed(){return {v:1,updatedAt:0,balance:0,earned:0,
  activities:[
    {id:uid(),name:'Hacer ejercicio',pts:15,per:10,unit:'min',icon:'run'},
    {id:uid(),name:'Estudiar japonés 1 h',pts:40,icon:'kana'},
    {id:uid(),name:'Tomar 2 L de agua',pts:10,icon:'drop'},
    {id:uid(),name:'Ordenar mi pieza',pts:20,icon:'broom'},
    {id:uid(),name:'Dormir antes de las 12',pts:30,icon:'moon'},
    {id:uid(),name:'Comer fruta',pts:10,icon:'apple'}],
  rewards:[
    {id:uid(),name:'Comida especial',price:220,icon:'bowl'},
    {id:uid(),name:'Un capítulo de anime',price:90,icon:'tv'},
    {id:uid(),name:'Café de cafetería',price:110,icon:'cup'},
    {id:uid(),name:'1 h de videojuegos',price:100,icon:'game'},
    {id:uid(),name:'Compra pequeña',price:450,icon:'bag'}],
  log:[],settings:{credit:300,interest:10}}}
function valid(d){return d&&typeof d==='object'&&Array.isArray(d.activities)&&Array.isArray(d.rewards)&&Array.isArray(d.log)&&typeof d.balance==='number'&&d.settings}
var S=null;
try{var raw=localStorage.getItem(KEY);if(raw){var d=JSON.parse(raw);if(valid(d))S=d}}catch(e){}
if(!S)S=seed();
(function(){var NP={'Comida especial':[150,220],'Un capítulo de anime':[60,90],'Café de cafetería':[80,110],'1 h de videojuegos':[70,100],'Compra pequeña':[300,450]};if(!S.settings.econ2){(S.rewards||[]).forEach(function(r){var n=NP[r.name];if(n&&r.price===n[0])r.price=n[1]});if(S.food&&S.food.banned)S.food.banned.forEach(function(b){if(b.price===100&&/papas-fritas-caseras/.test(b.fid))b.price=150;else if(b.price===80)b.price=130;else if(b.price===60)b.price=100});S.settings.econ2=true}})();
S.activities.forEach(function(a){if(a.name==='Hacer ejercicio'&&a.pts===50&&!a.unit&&a.icon==='run'){a.pts=15;a.per=10;a.unit='min'}});
var syncMode='local';
function persistLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function save(){S.updatedAt=Date.now();if(S.log.length>2500)S.log=S.log.slice(-2500);persistLocal();scheduleRemote()}

/* ---------- guardado en la cuenta ---------- */
var ref=null,writing=false,again=false,tmr=null;
function scheduleRemote(){if(!ref)return;clearTimeout(tmr);tmr=setTimeout(flush,700)}
function flush(){
  if(!ref)return;if(writing){again=true;return}
  writing=true;
  ref.set(JSON.parse(JSON.stringify(S))).then(function(){syncMode='cloud';setSync()},function(e){
    if(e&&e.code==='unavailable'){setTimeout(flush,1500+Math.random()*1500)}else{syncMode='local';setSync()}
  }).then(function(){writing=false;if(again){again=false;flush()}});
}
function adopt(d){if(valid(d)&&(d.updatedAt||0)>(S.updatedAt||0)){S=JSON.parse(JSON.stringify(d));ensureFood();persistLocal();render()}}
function initCloud(){
  initSample();
  if(!window.claude||typeof window.claude.use!=='function')return;
  Promise.all([window.claude.use('user'),window.claude.use('db')]).then(function(r){
    var user=r[0],db=r[1];if(!user||!db)return null;
    return user.id().then(function(id){
      if(!id)return;
      ref=db.doc('data/users/'+id+'/app');
      return ref.get().then(function(snap){
        if(snap.exists){var d=snap.data();if((d.updatedAt||0)>(S.updatedAt||0))adopt(d);else if(S.updatedAt>(d.updatedAt||0))flush();}
        else if(S.updatedAt>0)flush();
        syncMode='cloud';setSync();
        ref.onSnapshot(function(s){if(s.exists&&!s.metadata.hasPendingWrites)adopt(s.data())},function(){syncMode='local';setSync()});
      });
    });
  }).catch(function(){syncMode='local';setSync()});
}
function setSync(){var el=document.getElementById('sync');if(el){el.className='sync'+(syncMode==='cloud'?'':' loc');el.innerHTML='<i></i>'+(syncMode==='cloud'?'Guardado en tu cuenta':'Guardado solo en este dispositivo')}}

/* ---------- reglas ---------- */
function level(e){var l=1,acc=0,need=100;while(e>=acc+need){acc+=need;l++;need=100+(l-1)*50}return {l:l,into:e-acc,need:need}}
function creditLeft(){return S.balance+S.settings.credit}
function locked(){return S.balance<=-S.settings.credit||cardBlocked()}
function costFor(price){return {total:price,fee:0}}
function canBuy(price){var c=costFor(price);return !locked()&&(S.balance-c.total)>=-S.settings.credit}
function dayKey(t){var d=new Date(t);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function startOfDay(t){var d=new Date(t);d.setHours(0,0,0,0);return d.getTime()}
function startOfWeek(t){var d=new Date(startOfDay(t));var w=(d.getDay()+6)%7;return d.getTime()-w*864e5}
function todayCount(id){var s=startOfDay(Date.now()),n=0;S.log.forEach(function(e){if(e.kind==='a'&&e.ref===id&&e.t>=s)n++});return n}
function weekStats(){
  var w0=startOfWeek(Date.now()),w1=w0-7*864e5,cur=0,prev=0,pts=0,by={},byPrev={};
  S.log.forEach(function(e){if(e.kind!=='a')return;
    if(e.t>=w0){cur++;pts+=e.amt;by[e.ref]=(by[e.ref]||0)+1}
    else if(e.t>=w1){prev++;byPrev[e.ref]=(byPrev[e.ref]||0)+1}});
  return {cur:cur,prev:prev,pts:pts,by:by,byPrev:byPrev};
}

/* ---------- acciones ---------- */
var lastBump=false;
function complete(a,el,qty){
  var pts=a.unit?Math.max(1,Math.round(qty/a.per*a.pts)):a.pts;
  var e={id:uid(),t:Date.now(),kind:'a',ref:a.id,name:a.unit?a.name+' · '+qty+' '+a.unit:a.name,icon:a.icon,amt:pts,qty:qty||0};
  var wasDebt=S.balance<0,b0=S.balance,newly=S.rewards.filter(function(r){var p=priceOf(r).p;return r.fav&&b0<p&&b0+pts>=p});
  S.log.push(e);S.balance+=pts;S.earned+=pts;save();checkBadges(a);
  if(el){var r=el.getBoundingClientRect();var f=document.createElement('div');f.className='float';f.textContent='+'+pts;f.style.left=(r.left+r.width/2-20)+'px';f.style.top=(r.top+10)+'px';document.body.appendChild(f);setTimeout(function(){f.remove()},1000)}
  lastBump=true;render();sfx('coin');
  var cleared=wasDebt&&S.balance>=0;
  toast(cleared?'Deuda pagada. La tienda está abierta':newly.length?'¡Ya te alcanza para '+newly[0].name+'!':'+'+pts+' · '+e.name,e.id);if(newly.length)setTimeout(function(){sfx('capsule')},300);
  if(el){var nel=document.querySelector('[data-mis="'+a.id+'"]');if(nel){nel.classList.add('flash');setTimeout(function(){nel.classList.remove('flash')},500)}}
}
function undo(id){
  var i=S.log.findIndex(function(e){return e.id===id});if(i<0)return;
  var e=S.log[i];S.log.splice(i,1);S.balance-=e.amt;if(e.ban&&S.food.passes[e.ban]>0)S.food.passes[e.ban]--;if(e.kind==='a')S.earned=Math.max(0,S.earned-e.amt);save();render();
}
function buy(r,after){
  var c0=costFor(r.price),credit=S.balance-c0.total<0;
  if(S.settings.payAnim===false){sfx(credit?'paycredit':'pay');setTimeout(function(){doBuy(r,after)},380);return}
  payAnim(r,credit?'credit':'ok',function(){doBuy(r,after)});
}

function payAnim(r,mode,done){
  var L=sheet('<div class="sheet" role="dialog" aria-modal="true" aria-label="Pagando '+esc(r.name)+'" style="text-align:center">'+posHTML()+'<p class="pos-skip">Toca para saltar</p></div>',true),P=L.querySelector('#pos'),scr=L.querySelector('#posscr'),fin=false,T=[];
  function scrn(a,b,cl){scr.className='pos-scr'+(cl?' '+cl:'');scr.innerHTML='<b>'+a+'</b><span>'+b+'</span>'}

  L.querySelector('.sheet').onclick=end;
  scrn(fmt(r.price),'Acerca tu tarjeta');
  T.push(setTimeout(function(){P.classList.add('in')},60));
  T.push(setTimeout(function(){P.classList.add('tap');sfx('tapcard');scrn('···','Procesando')},620));
  T.push(setTimeout(function(){sfx(mode==='credit'?'paycredit':'pay');scrn(sv('<path d="m5 12 5 5 9-10"/>',30),mode==='credit'?'Aprobado · con crédito':'Aprobado · con saldo','ok')},1200));
  T.push(setTimeout(function(){P.classList.add('done')},1750));
  T.push(setTimeout(end,2150));
}
function payDecline(price,why){
  var L=sheet('<div class="sheet" role="dialog" aria-modal="true" aria-label="Pago rechazado" style="text-align:center">'+posHTML()+'<p style="font-size:14px;color:var(--t2);margin:4px 8px 12px">'+why+'</p><button class="btn wide" id="pdx">Entendido</button></div>',true),P=L.querySelector('#pos'),scr=L.querySelector('#posscr');
  scr.innerHTML='<b>'+fmt(price)+'</b><span>Acerca tu tarjeta</span>';
  setTimeout(function(){P.classList.add('in')},60);
  setTimeout(function(){P.classList.add('tap');sfx('tapcard')},620);
  setTimeout(function(){sfx('decline');scr.className='pos-scr no';scr.innerHTML='<b>Rechazada</b><span>'+(cardBlocked()?'Tarjeta bloqueada':'Sin cupo')+'</span>'},1150);
  setTimeout(function(){P.classList.add('done')},1900);
  L.querySelector('#pdx').onclick=closeLayer;
}
function doBuy(r,after){
  var c=costFor(r.price);
  var e={id:uid(),t:Date.now(),kind:'r',ref:r.id,name:r.name,icon:r.icon,amt:-c.total,fee:c.fee};
  if(r.ban){e.ban=r.ban;S.food.passes[r.ban]=(S.food.passes[r.ban]||0)+1}
  S.log.push(e);S.balance-=c.total;save();render();sfx('capsule');if(S.balance<0)setTimeout(function(){sfx('debt')},1500);gacha(r,c,after);

function actDays(id){var set={};S.log.forEach(function(e){if(e.kind==='a'&&e.ref===id)set[startOfDay(e.t)]=1});return set}
function habit(id){
  var set=actDays(id),days=Object.keys(set).length,today=startOfDay(Date.now()),d=set[today]?today:today-864e5,st=0;
  while(set[d]){st++;d=startOfDay(d-864e5+3600e3)}
  return {days:days,streak:st,formed:days>=66};
}

function searchFoods(q,cat){
  var n=norm(q.trim()),list=allFoods();
  if(cat)list=list.filter(function(f){return f.cat===cat});
  if(!n)return cat?list:S.food.recent.map(foodById).filter(Boolean).concat(list.filter(function(f){return f.cat==='mc'})).filter(function(f,i,a){return a.indexOf(f)===i}).slice(0,40);
  var words=n.split(/\s+/);
  return list.filter(function(f){var s=f.n||norm(f.name);return words.every(function(w){return s.indexOf(w)>=0})}).sort(function(a,b){return (norm(a.name).indexOf(words[0])===0?0:1)-(norm(b.name).indexOf(words[0])===0?0:1)}).slice(0,60);
}

var ACT=[[1.2,'Sedentaria','Poco o nada de ejercicio'],[1.375,'Ligera','Ejercicio 1 a 3 días por semana'],[1.55,'Moderada','Ejercicio 3 a 5 días por semana'],[1.725,'Alta','Ejercicio 6 a 7 días por semana'],[1.9,'Muy alta','Trabajo físico o entrenas 2 veces al día']];
function bmiCat(b){return b<18.5?['Bajo peso','var(--inf)']:b<25?['Peso normal','var(--su)']:b<30?['Sobrepeso','var(--wa)']:b<35?['Obesidad grado I','var(--er)']:b<40?['Obesidad grado II','var(--er)']:['Obesidad grado III','var(--er)']}
function curKg(){return S.weight.length?S.weight[S.weight.length-1].kg:(S.profile&&S.profile.kg)||0}
function computePlan(p){
  var kg=curKg()||p.kg,m=p.cm/100,bmi=kg/(m*m),bmr=10*kg+6.25*p.cm-5*p.age+(p.sex==='h'?5:-161),tdee=bmr*p.act,floor=p.sex==='h'?1500:1200;
  var r={kg:kg,bmi:bmi,bmr:bmr,tdee:tdee,floor:floor,mode:'mant',kcal:Math.round(tdee/10)*10};
  if(p.goal==='bajar'&&p.target&&p.target<kg){
    var tb=p.target/(m*m);r.targetBmi=tb;
    if(tb<18.5||bmi<18.5){r.mode='no';return r}
    var weeks=Math.max(1,(p.date-Date.now())/(7*864e5)),rate=(kg-p.target)/weeks,kcal=tdee-rate*7700/7;
    r.mode='bajar';r.rate=rate;r.weeks=weeks;
    if(rate>1||kcal<floor){
      r.tooFast=true;var safeKcal=Math.max(floor,tdee-550),safeRate=(tdee-safeKcal)*7/7700;
      if(safeRate<0.1){r.mode='mant';r.lowGap=true;return r}
      r.kcal=Math.round(safeKcal/10)*10;r.rate=safeRate;r.weeks=(kg-p.target)/safeRate;r.safeDate=Date.now()+r.weeks*7*864e5;
    }else r.kcal=Math.round(kcal/10)*10;
  }
  return r;
}
var MENU={des:[[['Pan marraqueta','un',0.5],['Palta','cda',2],['Leche semidescremada','vaso',1]],[['Avena en hojuelas','porc',1],['Leche semidescremada','vaso',1],['Plátano','un',1]]],
 alm:[[['Pechuga de pollo a la plancha','porc',1],['Arroz blanco cocido','taza',1],['Lechuga','taza',2],['Tomate','un',1],['Aceite vegetal / de oliva','cdta',1]],[['Arroz japonés cocido (gohan)','tazon',1],['Salmón cocido','porc',1],['Sopa de miso','tazon',1]]],
 once:[[['Pan de molde integral','reb',2],['Queso fresco','porc',1],['Té','taza',1]],[['Yogur natural entero','pote',1],['Frutillas','taza',1]]],
 cena:[[['Huevos revueltos','porc',1],['Pan de molde integral','reb',1],['Tomate','un',1]],[['Lentejas cocidas','taza',1],['Ensalada chilena (sin aceite)','plato',1]]],
 col:[[['Manzana','un',1]],[['Almendras','puñ',0.5]]]};
var SPLIT={des:.25,alm:.35,once:.15,cena:.2,col:.05};
function comboKcal(c){var tot=0,txt=[];c.forEach(function(it){var f=FOODS.find(function(x){return x.name===it[0]});if(!f)return;var m=f.ms.find(function(x){return x.k===it[1]});var g=(m?m.g:100)*it[2];tot+=f.kcal*g/100;txt.push((it[2]===0.5?'½':it[2])+' '+(it[2]>1?plural(UNITS[it[1]],it[2]):UNITS[it[1]])+' de '+f.name.toLowerCase())});return {kcal:Math.round(tot),txt:txt.join(', ')}}
function routineSection(p){
  var h='';if(p.days){var R=routine(p),wd=(new Date().getDay()+6)%7,wk=0;Object.keys(R).forEach(function(k){wk+=R[k].type==='cardio'?R[k].min:0});
    h+='<h2><span>Tu rutina semanal <small>'+p.days+' días · '+p.min+' min</small></span></h2><section class="card" style="padding:12px"><div class="week7">';
    for(var i=0;i<7;i++){var s=R[i];h+='<button class="d7'+(i===wd?' now':'')+(s?(s.type==='fuerza'?' str':' car'):'')+'"'+(s?' data-sess="'+i+'"':' disabled')+' aria-label="'+DN[i]+(s?': '+s.name:': descanso')+'"><span>'+DN[i].charAt(0)+'</span>'+(s?ic(s.type==='fuerza'?'dumbbell':'run',18):'<i>—</i>')+'</button>'}

    h+='<p style="font-size:12px;color:var(--t2);margin:8px 4px 0">La OMS recomienda 150 a 300 minutos de actividad moderada a la semana y fuerza 2 o más días. Esta rutina suma '+(wk+Object.keys(R).filter(function(k){return R[k].type==='fuerza'}).length*p.min)+' minutos.</p></section>';
  }
  return h;
}

  else h+='<div style="font-family:var(--h);font-size:24px;font-weight:700;margin-top:6px;position:relative">Día de descanso</div><div class="msg">Caminar un poco igual suma. Si quieres, registra lo que hagas abajo.</div>';
  h+='</section>'+stepsCard()+timerCard()+routineSection(p)+exCard();

}

    '<h1>¿Activamos el modo Fit?</h1><p style="margin-top:10px">Suma a Ganbaru un plan de comida con contador de calorías, una rutina de ejercicio con lo que tienes en casa, tu peso semana a semana y tu IMC. Cuidarte también te da monedas.</p>'+

function planCard(){
  var p=S.profile;
  if(!p)return '<h2>Tu IMC y tu plan</h2><section class="card" style="padding:16px;display:flex;gap:12px;align-items:center"><div style="flex:1"><div class="nm" style="font-weight:500">Calcula tu IMC y cuántas calorías necesitas</div><div style="font-size:13px;color:var(--t2)">Si quieres bajar de peso para una fecha, te arma un plan seguro.</div></div><button class="btn" data-act="plan">Calcular</button></section>';
  var r=computePlan(p),c=bmiCat(r.bmi),pos=Math.max(0,Math.min(100,(r.bmi-15)/(45-15)*100));
  var h='<h2>Tu IMC y tu plan<button class="lnk" data-act="plan">Editar</button></h2><section class="card" style="padding:16px">';
  h+='<div style="display:flex;align-items:baseline;gap:10px"><span class="num" style="font-size:30px;font-weight:700">'+r.bmi.toFixed(1).replace('.',',')+'</span><span class="pill" style="background:var(--bg);color:'+c[1]+';border:1px solid var(--bd)">'+c[0]+'</span></div>';
  h+='<div style="position:relative;height:8px;border-radius:4px;margin:12px 0 4px;display:flex;overflow:hidden;gap:2px"><i style="flex:3.5;background:#2F63C9"></i><i style="flex:6.5;background:#1E7F55"></i><i style="flex:5;background:#9A5C00"></i><i style="flex:5;background:#D9534F"></i><i style="flex:5;background:#C93636"></i><i style="flex:5;background:#8E2626"></i><b style="position:absolute;top:-5px;left:calc('+pos+'% - 2px);width:4px;height:18px;border-radius:2px;background:var(--tx)"></b></div><div style="position:relative;height:14px;font-size:11px;color:var(--t2)">'+[[15,'15'],[18.5,'18,5'],[25,'25'],[30,'30'],[35,'35'],[40,'40']].map(function(x){return '<span style="position:absolute;left:'+((x[0]-15)/30*100)+'%;transform:translateX('+(x[0]===15?'0':'-50%')+')">'+x[1]+'</span>'}).join('')+'</div><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px;margin-top:10px;font-size:12px;color:var(--t2)">'+[['Bajo peso','menos de 18,5'],['Normal','18,5 a 24,9'],['Sobrepeso','25 a 29,9'],['Obesidad grado I','30 a 34,9'],['Obesidad grado II','35 a 39,9'],['Obesidad grado III','40 o más']].map(function(x){return '<span'+(x[0]===c[0]||(x[0]==='Normal'&&c[0]==='Peso normal')?' style="color:var(--tx);font-weight:600"':'')+'>'+x[0]+': '+x[1]+'</span>'}).join('')+'</div>';
  h+='<div style="font-size:13px;color:var(--t2);margin-top:12px">Gastas cerca de <b class="num" style="color:var(--tx)">'+fmt(r.tdee)+'</b> kcal al día.</div>';
  if(r.mode==='no')h+='<div class="banner" style="margin:12px 0 0">'+ui('info',18)+'<div>Ese peso meta quedaría bajo un IMC de 18,5, así que no armo un plan para llegar ahí. Si quieres cambiar tu peso, lo mejor es hablarlo con un nutricionista.</div></div>';
  else if(r.mode==='bajar'){
    h+='<div style="margin-top:12px;background:var(--pr-t);border-radius:14px;padding:12px 14px;color:var(--pr-d)"><div style="font-family:var(--h);font-weight:600;font-size:17px">Plan: '+fmt(r.kcal)+' kcal al día</div><div style="font-size:13px;margin-top:4px">Para llegar a '+String(p.target).replace('.',',')+' kg bajando unos '+r.rate.toFixed(1).replace('.',',')+' kg por semana'+(r.tooFast?', con llegada estimada el '+new Date(r.safeDate).toLocaleDateString('es-CL',{day:'numeric',month:'long',year:'numeric'}):'')+'.</div></div>';
    if(r.tooFast)h+='<div class="banner" style="margin:10px 0 0">'+ui('info',18)+'<div>La fecha que elegiste pedía bajar más de lo seguro (más de 1 kg por semana o comer menos de '+fmt(r.floor)+' kcal). Te propongo un ritmo más tranquilo.</div></div>';
  }else if(r.lowGap)h+='<div class="banner info" style="margin:12px 0 0">'+ui('info',18)+'<div>Tu gasto ya está cerca del mínimo recomendado de '+fmt(r.floor)+' kcal, así que el plan es mantener y sumar actividad física.</div></div>';
  h+='<div class="acts" style="margin-top:12px"><button class="btn sec" data-act="menu">Ver menú de ejemplo</button>'+(S.food.goal===r.kcal?'<span class="pill su" style="align-self:center;justify-content:center;flex:1;min-height:44px;border-radius:12px">Es tu meta diaria</span>':'<button class="btn" data-act="usegoal">Usar '+fmt(r.kcal)+' kcal</button>')+'</div>';
  h+='<div style="font-size:12px;color:var(--t2);margin-top:10px">Estimación con la fórmula de Mifflin-St Jeor. No reemplaza a un nutricionista.</div></section>';

function planSheet(){

  h+='<div id="pbaj" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px"><div class="field"><label for="pt">Peso meta (kg)</label><input id="pt" type="number" inputmode="decimal" step="0.1" min="25" max="300" value="'+(p.target||'')+'"></div><div class="field"><label for="pd">Para cuándo</label><input id="pd" type="date" value="'+ds+'"></div></div><span class="err" id="ep2" role="alert" style="display:block;margin:-6px 0 10px"></span>';
  h+='<p style="font-size:12px;color:var(--t2);margin:0 0 12px">Este cálculo es para adultos y no aplica en embarazo o lactancia.</p><div class="acts"><button type="button" class="btn sec" id="pcx">Cancelar</button><button class="btn" type="submit">Calcular</button></div></form>';

function banReward(f,bn){return {id:'ban:'+f.id,ban:f.id,name:f.name,price:bn.price,icon:'bowl'}}

/* ---------- pasos ---------- */
var STEP_REWARD=25;
function stp(){if(!S.steps)S.steps={plan:null,log:{},rew:{}};S.steps.log=S.steps.log||{};S.steps.rew=S.steps.rew||{};return S.steps}
function stepGoalAt(d){var g=stp().plan;if(!g)return 0;var w=Math.floor((startOfDay(d)-startOfDay(g.since))/(7*DAY));return Math.min(g.end,g.start+Math.max(0,w)*g.inc)}
function stepGoal(){return stepGoalAt(Date.now())}
function stepsOn(d){return stp().log[d]||0}
function stepBase(){var a=S.profile?S.profile.act:1.2;return a<=1.2?4000:a<=1.375?5500:1e9}
function stepKg(){return curKg()||(S.profile&&S.profile.kg)||65}
function stepNet(n){var x=Math.max(0,n-stepBase());return Math.round(2.5*3.5*stepKg()/200*(x/100))}
function stepInfo(n){var cm=(S.profile&&S.profile.cm)||160;return {min:Math.round(n/100),km:n*cm*0.414/100000,kcal:Math.round(2.5*3.5*stepKg()/200*(n/100))}}
function stepsNetDay(){return stp().plan?stepNet(stepGoal()):0}
function stepWeeks(g){return Math.max(0,Math.ceil((g.end-g.start)/g.inc))}
function k1(n){return fmt(n)}
function setSteps(d,n){var s=stp(),g=stepGoalAt(d);n=Math.max(0,Math.min(60000,Math.round(n)));s.log[d]=n;
  var was=!!s.rew[d],now=g>0&&n>=g;
  if(now&&!was){s.rew[d]=1;S.log.push({id:uid(),t:Date.now(),kind:'g',ref:'steps',name:'Meta de pasos: '+fmt(g),icon:'run',amt:STEP_REWARD});S.balance+=STEP_REWARD;S.earned+=STEP_REWARD;save();render();sfx('coin');toast('Meta de pasos cumplida · +'+STEP_REWARD+' monedas');return}
  if(!now&&was&&startOfDay(Date.now())===d){delete s.rew[d];var i=-1;for(var j=S.log.length-1;j>=0;j--){if(S.log[j].ref==='steps'&&startOfDay(S.log[j].t)===d){i=j;break}}if(i>=0){S.log.splice(i,1);S.balance-=STEP_REWARD;S.earned-=STEP_REWARD}}
  save();render();sfx('tap');toast('Pasos guardados')}
function stepStreak(){var d=startOfDay(Date.now()),n=0;if(!stp().rew[d])d=startOfDay(d-DAY+3600e3);while(stp().rew[d]){n++;d=startOfDay(d-DAY+3600e3)}return n}
function stepsCard(compact){
  var s=stp(),g=s.plan;
  if(!g)return compact?'':'<section class="card" style="padding:16px;display:flex;gap:12px;align-items:center;margin:16px 0 6px"><span class="ic" style="background:var(--su-t);color:var(--su)">'+ic('run',20)+'</span><div style="flex:1"><div class="nm" style="font-weight:500">Meta de pasos diaria</div><div style="font-size:13px;color:var(--t2)">Parte de a poco y súbela semana a semana, por ejemplo de 6.000 a 10.000.</div></div><button class="btn" data-act="stepplan">Activar</button></section>';
  var d=compact?startOfDay(Date.now()):(view==='comida'?foodDay:startOfDay(Date.now())),goal=stepGoalAt(d),n=stepsOn(d),pct=Math.min(1,n/goal),inf=stepInfo(n),st=stepStreak(),wk=Math.floor((startOfDay(d)-startOfDay(g.since))/(7*DAY))+1,top=goal>=g.end;

  h+='<div style="height:10px;border-radius:5px;background:var(--su-t);overflow:hidden;margin:8px 0 6px"><i style="display:block;height:100%;width:'+(pct*100).toFixed(1)+'%;background:var(--su);border-radius:5px;transition:width .4s"></i></div>';
  h+='<div style="font-size:12px;color:var(--t2)">'+(n?'≈ '+inf.min+' min caminando · '+inf.km.toFixed(1).replace('.',',')+' km · '+fmt(inf.kcal)+' kcal':'Anota el total que marca tu celular o reloj.')+(n<goal&&n?' · faltan '+fmt(goal-n):'')+'</div>';

function waterOn(d){return wtr().log[d]||0}
function waterMission(){return S.activities.find(function(a){return !a.unit&&/agua/i.test(norm(a.name))})}
function lt(ml){return (ml/1000).toFixed(ml%1000?(ml%100?2:1):1).replace('.',',')+' L'}
function addWater(d,ml){var w=wtr(),g=w.goal,before=waterOn(d),n=Math.max(0,Math.min(8000,before+ml));w.log[d]=n;var today=startOfDay(Date.now())===d;

function chefTarget(meal){var g=S.food.goal||1800,d=startOfDay(Date.now()),eaten=dayKcal(d),already=dayEntries(d).filter(function(e){return e.meal===meal}).reduce(function(a,e){return a+e.kcal},0);

  h+='<div class="field"><span style="font-size:13px;font-weight:500;color:var(--t2)">Tiempo para cocinar</span><div id="chtm" style="display:flex;gap:6px">'+[['10','10 min'],['20','20 min'],['40','40 min o más']].map(function(x){return '<button type="button" data-t="'+x[0]+'" class="pill" style="flex:1;justify-content:center;min-height:36px;border:1px solid var(--bd);background:var(--sf);color:var(--t2)">'+x[1]+'</button>'}).join('')+'</div></div>';

   'Responde SOLO con JSON, sin texto extra: {"ok":true,"nombre":"nombre corto y apetitoso","minutos":número,"kcal":número total,"proteinas_g":número,"ingredientes":[{"nombre":"…","cantidad":"ej. 1 taza (150 g)","kcal":número}],"pasos":["paso corto", "…"],"tip":"un consejo breve opcional o null"}. '+

/* ---------- sueño ---------- */
var SLEEP_REWARD=10,MEAS_REWARD=10,RETO_REWARD=60;
function slp(){if(!S.sleep)S.sleep={log:{},rew:{}};S.sleep.log=S.sleep.log||{};S.sleep.rew=S.sleep.rew||{};return S.sleep}
function sleepOn(d){return slp().log[d]||null}
function hShort(h){var hh=Math.floor(h),mm=Math.round((h-hh)*60);return mm?hh+':'+String(mm).padStart(2,'0')+' h':hh+' h'}
function hTxt(h){var hh=Math.floor(h),mm=Math.round((h-hh)*60);return hh+(mm?' h '+mm+' min':' h')}
function sleepCoins(sc){return !sc?0:sc.tot>=90?25:sc.tot>=75?15:sc.tot>=60?10:sc.tot>=45?5:0}
function setSleep(d,h,bed,wake,q){var s=slp();s.log[d]={h:h,bed:bed||'',wake:wake||'',q:q||''};var today=d===startOfDay(Date.now());if(today&&bed&&lateNight(bed))setTimeout(offerTrasnoche,900);
  var sc=sleepScore(d),amt=today?sleepCoins(sc):0,ex=null;
  if(today)for(var j=S.log.length-1;j>=0;j--){var e=S.log[j];if(e.ref==='sleep'&&startOfDay(e.t)===d){ex=e;break}}
  var prev=ex?ex.amt:0,diff=amt-prev;
  if(today&&diff!==0){if(ex&&!amt){S.log.splice(S.log.indexOf(ex),1);delete s.rew[d]}else if(ex){ex.amt=amt;ex.name='Sueño de '+sc.tot+' puntos'}else{S.log.push({id:uid(),t:Date.now(),kind:'g',ref:'sleep',name:'Sueño de '+sc.tot+' puntos',icon:'moon',amt:amt});s.rew[d]=1}
    S.balance+=diff;S.earned+=diff}
  save();render();
  if(today&&diff>0){sfx('coin');toast(sc.tot+' puntos de sueño · +'+amt+' monedas')}else{sfx('tap');toast(sc?sc.tot+' puntos de sueño':'Sueño guardado')}}

  return '<section class="card" style="padding:14px;margin:14px 0"><div style="display:flex;align-items:center;gap:10px"><span class="ic" style="background:#ECEAFB;color:#3A2E9E">'+ic('moon',20)+'</span><div style="flex:1"><div class="nm" style="font-weight:600">¿Cuánto dormiste'+(today?' anoche':'')+'?</div><div style="font-size:12px;color:var(--t2)">'+hTxt(sleepGoal())+' o más da '+(today?'+'+SLEEP_REWARD+' monedas':'el mejor descanso')+'</div></div></div><div style="display:flex;gap:6px;margin-top:12px">'+[5,6,7,8,9].map(function(x){return '<button class="btn sec" style="flex:1;min-width:0;padding:0" data-sleep="'+x+'">'+x+(x===9?'+':'')+' h</button>'}).join('')+'</div><button class="lnk" style="margin-top:6px" data-act="sleep">Anotar hora exacta</button></section>'}

var AC=null;
function actx(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}if(AC&&AC.state==='suspended'){try{AC.resume()}catch(e){}}return AC}
function tone(f1,f2,t0,dur,vol,type){var c=AC,o=c.createOscillator(),g=c.createGain(),lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3200;o.type=type||'sine';o.frequency.setValueAtTime(f1,c.currentTime+t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,c.currentTime+t0+dur);g.gain.setValueAtTime(0.0001,c.currentTime+t0);g.gain.exponentialRampToValueAtTime(vol,c.currentTime+t0+0.012);g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+t0+dur);o.connect(lp);lp.connect(g);g.connect(c.destination);o.start(c.currentTime+t0);o.stop(c.currentTime+t0+dur+0.05)}

    else if(k==='paycredit'){tone(1950,0,0,0.09,0.06,'sine');tone(1460,0,0.13,0.22,0.06,'sine')}

function suNext(){
  var err=document.getElementById('esu');
  if(SU.step===0){var a=parseInt(document.getElementById('sa').value,10),cm=parseFloat(document.getElementById('scm').value),kg=parseFloat(String(document.getElementById('skg').value).replace(',','.'));
    SU.age=isNaN(a)?'':a;SU.cm=isNaN(cm)?'':cm;SU.kg=isNaN(kg)?'':kg;
    if(!(a>=18&&a<=100)||!(cm>=120&&cm<=230)||!(kg>=25&&kg<=300)){err.textContent='Revisa edad (18 a 100), altura (120 a 230 cm) y peso (25 a 300 kg)';return}}
  if(SU.step===2&&SU.goal==='bajar'){var sc=document.getElementById('ssup');if(sc)SU.pace=sc.checked?'sup':(SU.pace==='sup'?'max':SU.pace);var t=parseFloat(String(document.getElementById('st').value).replace(',','.')),dv=document.getElementById('sd').value,dt=dv?new Date(dv+'T12:00:00').getTime():0;SU.target=isNaN(t)?'':t;SU.date=dv;
    if(!(t>=25&&t<SU.kg)){err.textContent='El peso meta tiene que ser menor que tu peso actual';return}
    var t2=parseFloat(String((document.getElementById('st2')||{}).value||'').replace(',','.')),dv2=(document.getElementById('sd2')||{}).value||'';SU.target2=t2>0?t2:'';SU.date2=dv2;
    if(t2>0&&!(t2<t)){err.textContent='La meta a largo plazo tiene que ser menor que la de corto plazo';return}
    if(t2>0&&t2/((SU.cm/100)*(SU.cm/100))<18.5){err.textContent='La meta a largo plazo quedaría bajo un IMC de 18,5';return}
    if(!dv){var es=suEst(t);if(es){SU.date=es.calmISO;dt=new Date(es.calmISO+'T12:00:00').getTime()}}
    if(!(dt>Date.now()+6*864e5)){err.textContent='Elige una fecha al menos una semana en el futuro';return}}
  if(SU.step===3){

    S.profile=np;S.food.goal=computePlan(np).kcal;save();
  }

}

/* ---------- tarjeta Ganbaru ---------- */
var DAY=864e5;
function lastCloseBefore(t){var d=new Date(t);d.setHours(23,59,59,999);var back=(d.getDay()+7-0)%7;d.setDate(d.getDate()-back);if(d.getTime()>t)d.setDate(d.getDate()-7);return d.getTime()}
function nextClose(){return lastCloseBefore(Date.now())+7*DAY}
function balanceAt(t){var b=S.balance;S.log.forEach(function(e){if(e.t>t)b-=e.amt});return b}
function paidBetween(a,b){var s=0;S.log.forEach(function(e){if(e.amt>0&&e.kind!=='i'&&e.t>a&&e.t<=b)s+=e.amt});return s}
function ensureCard(){if(!S.card)S.card={start:Date.now(),last:lastCloseBefore(Date.now()),stmts:[]};if(S.settings.interest===undefined)S.settings.interest=10}
function processCard(){
  ensureCard();var now=Date.now(),changed=false,c=S.card.last+7*DAY;
  while(c<=now){var debt=Math.max(0,-balanceAt(c));if(debt>0){S.card.stmts.push({id:uid(),close:c,due:c+3*DAY,amount:debt,min:Math.ceil(debt*0.25),status:'abierto'})}S.card.last=c;c+=7*DAY;changed=true}
  S.card.stmts.forEach(function(s){
    if(s.status==='abierto'&&now>s.due){var paid=paidBetween(s.close,s.due);s.paid=paid;
      if(paid>=s.amount)s.status='pagado';
      else{var rem=s.amount-paid,it=Math.max(1,Math.round(rem*S.settings.interest/100));s.interest=it;
        S.log.push({id:uid(),t:s.due,kind:'i',ref:s.id,name:'Interés por pago incompleto',icon:'star',amt:-it});S.balance-=it;
        s.status=paid>=s.min?'parcial':'mora'}
      changed=true}
    if(s.status==='mora'&&paidBetween(s.due,now)>=s.min){s.status='regularizado';changed=true}
  });
  if(S.card.stmts.length>60)S.card.stmts=S.card.stmts.slice(-60);
  if(changed)save();
}
function openStmt(){ensureCard();return S.card.stmts.filter(function(s){return s.status==='abierto'}).slice(-1)[0]||null}
function cardBlocked(){ensureCard();return S.card.stmts.some(function(s){return s.status==='mora'})}
function fd(t,o){var s=new Date(t).toLocaleDateString('es-CL',o||{weekday:'long',day:'numeric'});return s}
function cardTier(){var l=level(S.earned).l;return l>=5?['platino','Platino']:l>=3?['oro','Oro']:['clasica','Clásica']}
function cardFace(o){
  var cl='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8.5 7.5a6 6 0 0 1 0 9M12 5a9.5 9.5 0 0 1 0 14M15.5 2.5a13 13 0 0 1 0 19"/></svg>';
  var h='<div class="ccard tier-'+o.tier[0]+(o.blocked?' blocked':'')+'" role="img" aria-label="Tarjeta Ganbaru '+o.tier[1]+', cupo usado '+o.used+' de '+o.lim+'">';
  h+='<span class="cc-holo"></span><span class="cc-glare"></span><span class="cc-wm">頑張る</span><div class="cc-top"><span class="cc-brand">'+logo(26,false,true)+'<b>Ganbaru</b></span><span class="cc-tier">'+o.tier[1]+'</span></div>';
  h+='<div class="cc-mid"><span class="cc-chip"><i></i></span><span class="cc-nfc">'+cl+'</span></div>';
  h+='<div class="cc-num num">•••• •••• •••• '+o.last+'</div>';
  h+='<div class="cc-bot"><div><span>Cupo usado</span><b class="num">'+fmt(o.used)+' / '+fmt(o.lim)+'</b></div><div style="text-align:right"><span>'+o.rlab+'</span><b>'+o.rval+'</b></div></div>';
  h+='<div class="cc-bar"><i style="width:'+Math.min(100,Math.round(o.used/o.lim*100))+'%"></i></div>';
  if(o.blocked)h+='<span class="cc-stamp">BLOQUEADA</span>';
  return h+'</div>';
}
function cardStrip(){
  ensureCard();var lim=S.settings.credit,used=Math.max(0,-S.balance),st=openStmt(),bl=cardBlocked(),last=String(new Date(S.card.start).getFullYear()).slice(-4);
  var rlab='Estado',rval=used?'Con deuda':'Al día';
  if(st){rlab='Pagar antes del';rval=new Date(st.due).toLocaleDateString('es-CL',{weekday:'short',day:'numeric'})}
  var h='<section class="cc-wrap">'+cardFace({tier:cardTier(),blocked:bl,used:used,lim:lim,last:last,rlab:rlab,rval:rval});
  var msg;
  if(bl){var m=S.card.stmts.filter(function(s){return s.status==='mora'})[0];var falta=Math.max(0,m.min-paidBetween(m.due,Date.now()));msg=ui('lock',16)+'<div>No pagaste el mínimo. Gana <b>'+fmt(falta)+'</b> monedas para desbloquearla.</div>'}
  else if(st){var p=paidBetween(st.close,Date.now());msg=ui('info',16)+'<div>Estado de cuenta: paga <b>'+fmt(st.amount)+'</b> antes del '+fd(st.due)+' (mínimo '+fmt(st.min)+'). Llevas <b>'+fmt(Math.min(p,st.amount))+'</b>.</div>'}
  else if(used)msg=ui('info',16)+'<div>Disponible <b>'+fmt(Math.max(0,lim-used))+'</b>. Se factura el domingo '+fd(nextClose(),{day:'numeric',month:'short'})+' y pagas hasta el miércoles.</div>';
  else msg=ui('info',16)+'<div>Disponible <b>'+fmt(lim)+'</b>. Próxima facturación: domingo '+fd(nextClose(),{day:'numeric',month:'short'})+'.</div>';
  return h+'<div class="cc-info'+(bl?' bad':'')+'">'+msg+'</div></section>';
}
function stmtSection(){
  ensureCard();var L=S.card.stmts.slice().reverse();if(!L.length)return '';
  var lab={abierto:['Por pagar','var(--wa)'],pagado:['Pagado','var(--su)'],parcial:['Pago parcial','var(--wa)'],mora:['Sin pago mínimo','var(--er)'],regularizado:['Regularizado','var(--t2)']};
  var h='<h2><span>Estados de cuenta</span></h2><section class="card">';
  L.slice(0,8).forEach(function(s){var l=lab[s.status];h+='<button class="rw" data-stmt="'+s.id+'" style="width:100%;background:none;border:0;border-top:1px solid var(--bd);text-align:left;font:inherit;color:inherit"><div class="mid"><div class="nm">Semana al '+fd(s.close,{day:'numeric',month:'short'})+'</div><div class="sub">Facturado '+fmt(s.amount)+(s.interest?' · interés '+fmt(s.interest):'')+' · vence '+fd(s.due,{day:'numeric',month:'short'})+'</div></div><span class="pill" style="background:var(--bg);border:1px solid var(--bd);color:'+l[1]+'">'+l[0]+'</span>'+sv('<path d="m9 6 6 6-6 6"/>',16)+'</button>'});
  return h+'</section><div style="font-size:12px;color:var(--t2);margin:6px 4px 0">Toca un estado de cuenta para ver el documento completo.</div>';
}

var FOOD_REWARD=30,WEIGHT_REWARD=10;
function processHealthRewards(){
  if(!S.profile||!S.food.goal)return;S.food.rew=S.food.rew||{};var g=S.food.goal,today=startOfDay(Date.now()),changed=false;
  for(var i=1;i<=14;i++){var d=startOfDay(today-i*DAY+3600e3);if(S.food.rew[d]!==undefined)continue;if(d<startOfDay(S.profile.created||today))continue;
    var es=dayEntries(d),k=es.reduce(function(a,e){return a+e.kcal},0),ok=es.length>=2&&k>=g*0.9&&k<=g*1.05;S.food.rew[d]=ok?1:0;changed=true;
    if(ok){S.log.push({id:uid(),t:d+23*3600e3,kind:'g',ref:'food',name:'Meta de comida cumplida',icon:'bowl',amt:FOOD_REWARD});S.balance+=FOOD_REWARD;S.earned+=FOOD_REWARD}}
  if(changed)save();
}

  var fd=t.getAttribute('data-fday');if(fd){var nd=startOfDay(foodDay+parseInt(fd,10)*864e5+(fd>0?3600e3:-3600e3)+43200e3*0);nd=startOfDay(foodDay+parseInt(fd,10)*864e5+12*3600e3*(fd>0?1:-1)+ (fd>0?0:12*3600e3));if(nd<=startOfDay(Date.now())){foodDay=nd;render()}return}
  if(act==='tstart'||act==='tpause'||act==='tstop'||act==='treset'){tmrAct(act);return}
  var tx=t.getAttribute('data-tex');if(tx!==null){tmrState().ex=+tx;save();render();return}
  var sdt=t.getAttribute('data-sdate');if(sdt){var sdI=document.getElementById('sd');if(sdI)sdI.value=sdt;SU.date=sdt;document.querySelectorAll('.est-o').forEach(function(b){b.classList.toggle('on',b===t)});var pv2=document.getElementById('suprev2');if(pv2)pv2.innerHTML=suPreview2();sfx('coin');return}
  var tm=t.getAttribute('data-tmode');if(tm){tmrState().mode=tm;save();render();return}
  var tsp=t.getAttribute('data-tspd');if(tsp){var st0=tmrState();tmrSetSpeed(st0.spd[st0.mode]+parseFloat(tsp));return}
  if(act==='snext'){suNext();return}
  if(act==='sback'){SU.step=Math.max(S.profile?0:-1,SU.step-1);render();return}
  if(act==='fityes'){S.settings.fit=true;SU.step=0;save();render();window.scrollTo(0,0);return}
  if(act==='fitno'){S.settings.fit=false;S.settings.setupDone=true;SU.step=-1;save();if(location.hash==='#tablero')render();else location.hash='#tablero';return}
  if(act==='fittoggle'){if(fitOn()){S.settings.fit=false;save();render();toast('Modo Fit desactivado')}else{S.settings.fit=true;if(!S.profile){SU.step=0;S.settings.setupDone=false}save();render();window.scrollTo(0,0)}return}
  if(act==='sskip'||act==='sdone'){S.settings.setupDone=true;save();var bk=SU.back||(act==='sdone'?'#fit':'#tablero');if(act==='sdone'){foodTab='progreso'}SU.back=null;SU.step=-1;if(location.hash===bk)render();else location.hash=bk;window.scrollTo(0,0);return}

  var b=t.getAttribute('data-buy');

    confirmBuy(r);return}
  var er=t.getAttribute('data-editr');

  var dl=t.getAttribute('data-del');

/* ---------- tarjeta con inclinación 3D ---------- */
(function(){
  if(RM)return;
  function set(c,px,py,on){px=Math.max(0,Math.min(1,px));py=Math.max(0,Math.min(1,py));var st=c.style;
    st.setProperty('--ry',((px-.5)*18).toFixed(2)+'deg');st.setProperty('--rx',((.5-py)*14).toFixed(2)+'deg');
    st.setProperty('--gx',(px*100).toFixed(1)+'%');st.setProperty('--gy',(py*100).toFixed(1)+'%');st.setProperty('--hx',(px*100).toFixed(1)+'%');
    st.setProperty('--px',((.5-px)*14).toFixed(1)+'px');st.setProperty('--py',((.5-py)*10).toFixed(1)+'px');st.setProperty('--go',on?1:.55)}
  function reset(c){c.classList.remove('tilting');['--ry','--rx','--px','--py','--go'].forEach(function(k){c.style.removeProperty(k)})}
  function at(c,e){var r=c.getBoundingClientRect();set(c,(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height,true)}
  var cur=null;
  document.addEventListener('pointermove',function(e){var c=e.target.closest&&e.target.closest('.ccard');if(c){if(cur&&cur!==c)reset(cur);cur=c;c.classList.add('tilting');at(c,e)}else if(cur){reset(cur);cur=null}},{passive:true});
  document.addEventListener('pointerdown',function(e){var c=e.target.closest&&e.target.closest('.ccard');if(c){cur=c;c.classList.add('tilting');at(c,e)}},{passive:true});
  ['pointerup','pointercancel'].forEach(function(t){document.addEventListener(t,function(e){if(cur&&e.pointerType!=='mouse'){reset(cur);cur=null}},{passive:true})});
  document.addEventListener('pointerleave',function(){if(cur){reset(cur);cur=null}});
  var base=null,raf=0,last=null;
  window.addEventListener('deviceorientation',function(e){if(e.gamma==null||e.beta==null)return;last=e;if(base===null)base=e.beta;if(raf)return;raf=requestAnimationFrame(function(){raf=0;var g=last.gamma,b=last.beta-base;base+=(last.beta-base)*.01;
    document.querySelectorAll('.ccard:not(.tilting)').forEach(function(c){set(c,.5+Math.max(-1,Math.min(1,g/30))*.35,.5+Math.max(-1,Math.min(1,b/30))*.35,false)})})},{passive:true});
})();
route();
setTimeout(initCloud,0);
})();
